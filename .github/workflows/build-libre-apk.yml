name: Build libre APK

on:
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # the Android Gradle plugin requires a modern Java version
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # cached, so that every build is signed with the same key and updates install over previous builds
      - name: Restore signing key
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: key.jks
          key: aves-fork-keystore-v1

      - name: Create signing key if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore key.jks -storepass avesfork -keypass avesfork \
            -alias aves -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aves fork"

      # use another application ID, so that this build can be installed next to the original app
      - name: Change application ID suffix
        run: sed -i 's/applicationIdSuffix = ".libre"/applicationIdSuffix = ".mio"/' android/app/build.gradle.kts

      - name: Build APK
        run: |
          NDK_VERSION=28.2.13676358
          export ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export ANDROID_NDK_ROOT=$ANDROID_NDK
          set -o pipefail
          # the files in `flavors/` are older than the main `pubspec.yaml` (different Flutter and package versions),
          # so the libre variant is derived from the main pubspec instead, as `scripts/apply_flavor_libre.sh` would do:
          prepare_libre() {
            ./flutterw clean &&
            ./flutterw pub get
          }
          # on failure, the end of the log is published as error annotations (readable without downloading logs)
          if ! { prepare_libre && ./flutterw gen-l10n && ./flutterw build apk -t lib/main_libre.dart --flavor libre --split-per-abi; } 2>&1 | tee build.log; then
            encode() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
            echo "::error title=Build log tail::$(tail -c 3500 build.log | encode)"
            echo "::error title=Build log errors::$(grep -iE -B1 -A3 'error|what went wrong|exception|failed' build.log | head -c 3500 | encode)"
            exit 1
          fi
        env:
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_STORE_PASSWORD: avesfork
          AVES_KEY_ALIAS: aves
          AVES_KEY_PASSWORD: avesfork

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aves-libre-apks
          path: build/app/outputs/apk/libre/release/*.apk
