name: Aves-X Beta release

# Use an Aves-X-specific tag prefix. Ordinary upstream-style v* tags must
# never invoke the inherited Aves Play Store publishing path.
on:
  push:
    tags:
      - 'aves-x-v*'

permissions:
  contents: read

jobs:
  build_libre:
    name: Build Aves-X libre APKs
    uses: ./.github/workflows/build-libre-apk.yml

  publish_github:
    name: Publish Aves-X prerelease
    needs: [build_libre]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Aves-X APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aves-x-libre-apks
          path: outputs

      - name: Create GitHub beta release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "outputs/*.apk"
          name: "Aves-X Beta 0.5"
          bodyFile: "release_body.md"
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
